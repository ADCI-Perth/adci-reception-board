<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>ADCI | Data check</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&family=Oswald:wght@500;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<link href="assets/css/board.css" rel="stylesheet">
<style>
  html, body { height: auto; overflow: auto; }
  body { background: var(--bg-body); color: var(--text-main); font-family: 'Inter', sans-serif; margin: 0; padding: 32px; }
  .page { max-width: 1100px; margin: 0 auto; }
  h1 { font-family: 'Oswald', sans-serif; color: var(--brand-dark); font-size: 36px; margin: 0 0 6px; }
  h2 { font-family: 'Oswald', sans-serif; color: var(--brand-dark); font-size: 24px; margin: 0 0 12px; }
  .lead { color: var(--text-muted); margin: 0 0 24px; }
  section { background: var(--bg-card); border-radius: var(--border-radius); box-shadow: var(--shadow-card); padding: 24px; margin-bottom: 24px; }
  ul { list-style: none; margin: 0; padding: 0; }
  li { padding: 10px 14px; border-radius: 8px; margin-bottom: 8px; font-weight: 600; }
  li.error { background: #fdecea; color: var(--alert-color); border-left: 6px solid var(--alert-color); }
  li.warning { background: #fff4e5; color: #9a4a00; border-left: 6px solid var(--warning-color); }
  li.ok { background: #e8f5e9; color: var(--success-color); border-left: 6px solid var(--success-color); }
  li.file-ok { background: #f4f7fa; border-left: 6px solid var(--success-color); }
  li.file-bad { background: #fdecea; color: var(--alert-color); border-left: 6px solid var(--alert-color); }
  .muted { color: var(--text-muted); font-weight: 400; }
  table { width: 100%; border-collapse: collapse; font-size: 15px; }
  th { text-align: left; background: var(--brand-dark); color: #fff; padding: 8px 12px; }
  td { padding: 8px 12px; border-bottom: 1px solid #e3e8ee; vertical-align: top; }
  td.mode { font-weight: 700; text-transform: capitalize; }
  a { color: var(--brand-blue); font-weight: 600; }
</style>
</head>
<body>
<div class="page">
  <h1>Data check</h1>
  <p class="lead">Open this page after uploading a new Calendar, Timetable or Board file to see if anything needs fixing and what the board will show over the next three weeks.</p>
  <section><h2>Files</h2><ul id="files"><li class="muted">Loading…</li></ul></section>
  <section><h2>Problems</h2><ul id="issues"><li class="muted">Checking…</li></ul></section>
  <section><h2>Notices</h2><ul id="notices"><li class="muted">Loading…</li></ul></section>
  <section><h2>Media</h2><ul id="media"><li class="muted">Loading…</li></ul></section>
  <section><h2>Next 21 days</h2><div id="preview" class="muted">Loading…</div></section>
</div>
<script type="module" src="assets/js/check.js"></script>
</body>
</html>
