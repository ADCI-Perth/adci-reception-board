<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>ADCI | Information Hub</title>
<!-- Fonts -->
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&family=JetBrains+Mono:wght@500;700&family=Oswald:wght@500;700&display=swap" rel="stylesheet">
<!-- Libraries -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/d3/3.5.17/d3.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/topojson/1.6.19/topojson.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/datamaps/0.5.1/datamaps.world.min.js"></script>

<style>
    /* --- VARIABLES --- */
    :root {
      --bg-body: #ecf0f3;
      --bg-card: #ffffff;
      --brand-dark: #002b55;       
      --brand-blue: #0056b3;       
      --brand-accent: #00d2ff;     
      --alert-color: #d32f2f;      
      --success-color: #2e7d32;
      --warning-color: #ed6c02;
      --text-main: #111111;        
      --text-muted: #555555;
      --shadow-card: 0 10px 30px rgba(0, 43, 85, 0.1);
      --border-radius: 16px;
    }

    body {
      margin: 0; font-family: 'Inter', sans-serif;
      background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
      color: var(--text-main);
      height: 100vh; display: flex; flex-direction: column; overflow: hidden;
    }

    /* --- HEADER --- */
    #header {
      height: 110px; flex: none;
      background: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(10px);
      display: flex; align-items: center; justify-content: space-between;
      padding: 0 50px; 
      border-bottom: 5px solid var(--brand-dark);
      box-shadow: 0 4px 20px rgba(0,0,0,0.05);
      z-index: 100;
    }
    .header-brand { display: flex; align-items: center; gap: 25px; }
    #logo { height: 80px; }
    #header-title {
      font-family: 'Oswald', sans-serif; font-size: 42px; color: var(--brand-dark); 
      text-transform: uppercase; letter-spacing: 1px;
    }
    .ticker-wrap {
        background: var(--brand-dark); color: #fff; padding: 10px 30px; border-radius: 50px;
        font-family: 'JetBrains Mono', monospace; font-size: 18px; display: flex; align-items: center;
        box-shadow: 0 5px 15px rgba(0, 43, 85, 0.3);
    }
    .live-dot { width: 12px; height: 12px; background: #00d2ff; border-radius: 50%; margin-right: 12px; animation: blink 1s infinite; }

    /* --- MAIN LAYOUT --- */
    #main { display: flex; height: calc(100vh - 110px); padding: 25px; gap: 25px; box-sizing: border-box; }
    
    .info-card, .col-map, .col-hub {
        background: var(--bg-card); border-radius: var(--border-radius);
        box-shadow: var(--shadow-card); border: 1px solid rgba(255,255,255,0.6);
    }

    /* --- COL 1: SIDEBAR (20%) --- */
    .col-sidebar { flex: 20%; display: flex; flex-direction: column; gap: 20px; }
    
    /* Clock */
    .clock-card {
        flex: 0.8; display: flex; flex-direction: column; align-items: center; justify-content: center;
        background: linear-gradient(180deg, #fff 0%, #f8faff 100%);
    }
    #clock { font-family: 'JetBrains Mono', monospace; font-size: 55px; font-weight: 700; color: var(--brand-dark); line-height: 1; }
    #date { font-size: 20px; font-weight: 600; color: var(--text-muted); margin-top: 10px; text-transform: uppercase; }

    /* Weather */
    .weather-card {
        flex: 0.8; display: flex; flex-direction: row; align-items: center; justify-content: center; gap: 20px;
        position: relative; overflow: hidden;
        border: 1px solid rgba(255, 255, 255, 0.6); border-top: 1px solid rgba(255, 255, 255, 0.9);
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.15);
    }
    .weather-card::after {
        content: ""; position: absolute; top: 0; left: 0; width: 100%; height: 50%;
        background: linear-gradient(to bottom, rgba(255,255,255,0.4) 0%, rgba(255,255,255,0) 100%);
        pointer-events: none; z-index: 1;
    }
    #weather-content { position: relative; z-index: 5; display: flex; align-items: center; gap: 15px; }
    .weather-icon { width: 70px; filter: drop-shadow(0 5px 10px rgba(0,0,0,0.2)); }
    .temp-big { font-size: 42px; font-weight: 800; line-height: 1; color: #fff; text-shadow: 0 2px 10px rgba(0,0,0,0.2); }
    .weather-text { font-size: 16px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.5px; color: #fff; text-shadow: 0 2px 5px rgba(0,0,0,0.2); }
    .sun-reminder {
        font-size: 11px;
        font-weight: 700;
        color: rgba(6, 131, 248, 0.9);
        margin-top: 4px;
        text-transform: uppercase;
        letter-spacing: 0.5px;
        animation: pulse 3s infinite;
    }

    /* Weather Gradients */
    .weather-sunny { background-color: #fdbb2d; background-image: radial-gradient(at 90% 10%, #2980b9 0px, transparent 50%), radial-gradient(at 10% 90%, #fdbb2d 0px, transparent 50%), radial-gradient(at 50% 50%, #6dd5fa 0px, transparent 50%); }
    .weather-cloudy { background-color: #bdc3c7; background-image: radial-gradient(at 0% 0%, #2c3e50 0px, transparent 50%), radial-gradient(at 100% 100%, #bdc3c7 0px, transparent 50%), radial-gradient(at 50% 50%, #8ca6db 0px, transparent 50%); }
    .weather-rain { background-color: #2c3e50; background-image: radial-gradient(at 80% 0%, #4ca1af 0px, transparent 50%), radial-gradient(at 0% 100%, #2c3e50 0px, transparent 50%), radial-gradient(at 0% 0%, #134e5e 0px, transparent 50%); }
    .weather-storm { background-color: #232526; background-image: radial-gradient(at 20% 20%, #414345 0px, transparent 50%), radial-gradient(at 80% 80%, #232526 0px, transparent 50%), radial-gradient(at 50% 50%, #4b134f 0px, transparent 50%); }
    .weather-snow { background-color: #e6dada; background-image: radial-gradient(at 0% 0%, #274046 0px, transparent 50%), radial-gradient(at 100% 0%, #e6dada 0px, transparent 50%), radial-gradient(at 100% 100%, #83a4d4 0px, transparent 50%); }
    .weather-mist { background-color: #606c88; background-image: radial-gradient(at 50% 0%, #B0DACD 0px, transparent 50%), radial-gradient(at 50% 100%, #3f4c6b 0px, transparent 50%); }

    /* QR Box */
    .qr-box { 
        flex: 1.5; background: var(--brand-dark); color: #fff; 
        display: flex; flex-direction: column; align-items: center; justify-content: center;
        text-align: center; padding: 20px; position: relative; overflow: hidden;
    }
    .qr-frame {
        background: white; padding: 10px; border-radius: 12px; width: 150px; height: 150px; 
        margin-bottom: 15px; display: flex; align-items: center; justify-content: center;
        box-shadow: 0 10px 30px rgba(0,0,0,0.3); z-index: 2;
    }
    .qr-frame img { width: 100%; height: 100%; object-fit: contain; }
    .qr-text-group { z-index: 2; }
    .qr-box h4 { margin: 0 0 5px; font-family: 'Oswald'; font-size: 26px; color: var(--brand-accent); text-shadow: 0 2px 4px rgba(0,0,0,0.3); }
    .qr-box p { margin: 0; font-size: 14px; opacity: 0.9; font-weight: 500; }

    /* --- COL 2: CENTER CAROUSEL (55% Width) --- */
    .col-map { 
        flex: 55%; position: relative; overflow: hidden; 
        background: #000; border: none;
    }
    
    .center-slide {
        position: absolute; top: 0; left: 0; width: 100%; height: 100%;
        opacity: 0; visibility: hidden; transition: opacity 1.2s ease-in-out, visibility 1.2s;
        display: flex; align-items: center; justify-content: center;
    }
    .center-slide.active-view { opacity: 1; visibility: visible; z-index: 10; }

    /* Map */
    #view-map { background: #eef2f5; }
    #map-viz { width: 100%; height: 100%; }
    .city-label { font-family: 'JetBrains Mono', monospace; font-size: 11px; font-weight: 700; fill: #002b55; text-shadow: 2px 0 #fff, -2px 0 #fff, 0 2px #fff, 0 -2px #fff; pointer-events: none; }
    .attack-line { fill: none; stroke-linecap: round; filter: drop-shadow(0 0 2px rgba(0,0,0,0.3)); }
    .ripple { fill: none; stroke-width: 2px; opacity: 0; }

    /* Media */
    .video-content { width: 100%; height: 100%; object-fit: contain; }
    #view-video { background: #000; }
    #view-image { overflow: hidden; }
    .blur-bg {
        position: absolute; top: -10%; left: -10%; width: 120%; height: 120%;
        background-size: cover; background-position: center;
        filter: blur(25px) brightness(0.7); z-index: 1;
        transition: background-image 1s ease;
    }
    .sharp-fg {
        position: relative; z-index: 2; max-width: 95%; max-height: 90%;
        object-fit: contain; box-shadow: 0 20px 50px rgba(0,0,0,0.5);
        border-radius: 8px; transition: transform 10s ease;
    }
    .ken-burns { animation: slowZoom 15s infinite alternate; }
    @keyframes slowZoom { 0% { transform: scale(1); } 100% { transform: scale(1.05); } }

    /* --- COL 3: HUB (25% Width) --- */
    /* --- COL 3: HUB (25% Width) --- */
    .col-hub { 
        flex: 25%; position: relative; overflow: hidden; 
        display: flex; flex-direction: column;
        background: #fff; padding: 20px;
    }
    .hub-title {
        font-family: 'Oswald', sans-serif; font-size: 28px; color: var(--brand-dark);
        border-bottom: 4px solid var(--brand-blue); padding-bottom: 15px; margin-bottom: 20px;
        display: flex; justify-content: space-between; align-items: center; flex: none;
    }
    #schedule-container { flex: 1; overflow-y: auto; padding-right: 5px; scroll-behavior: smooth; }
    #schedule-container::-webkit-scrollbar { display: none; }
    
    .event-row {
        display: flex; align-items: stretch; background: #fff; border: 1px solid #e0e4e8;
        border-left: 8px solid #ccc; 
        margin-bottom: 15px; border-radius: 12px;
        min-height: 120px; 
        box-shadow: 0 4px 10px rgba(0,0,0,0.03); transition: all 0.3s ease; position: relative; overflow: hidden;
    }
    .event-time {
        width: 90px; background: #f8f9fa; font-family: 'JetBrains Mono'; font-weight: 700; color: var(--text-main);
        display: flex; flex-direction: column; justify-content: center; align-items: center;
        font-size: 18px; border-right: 1px solid #eee; padding: 8px;
    }
    .event-time span.end-time { font-size: 14px; color: #666; font-weight: 500; margin-top: 4px; }
    .event-details { flex: 1; padding: 10px 15px; display: flex; flex-direction: column; justify-content: center; }
    .event-details h4 { margin: 0 0 5px 0; font-size: 20px; color: var(--brand-dark); font-weight: 800; line-height: 1.2; }
    .event-details p { margin: 0; font-size: 16px; color: #444; font-weight: 600; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
    
    .event-row.status-active {
        border-left-color: var(--success-color); background: #f0fdf4; border: 2px solid var(--success-color);
        transform: scale(1.02); box-shadow: 0 10px 25px rgba(46, 125, 50, 0.15); z-index: 2;
    }
    .event-row.status-active h4 { color: var(--success-color); }
    .progress-bg { position: absolute; bottom: 0; left: 0; width: 100%; height: 6px; background: rgba(0,0,0,0.1); }
    .progress-fill { height: 100%; background: var(--success-color); width: 0%; transition: width 1s linear; }
    
    /* THE NEW TEXT STYLE */
    .progress-stats { 
        font-family: 'JetBrains Mono', monospace; 
        font-size: 11px; 
        color: var(--success-color); 
        font-weight: 800; 
        margin-left: 10px; 
        letter-spacing: 0.5px;
    }

    .event-row.status-next { border-left-color: var(--warning-color); background: #fff8e1; border: 1px solid var(--warning-color); }
    .event-row.status-past { opacity: 0.5; filter: grayscale(0.8); border-left-color: #999; }
    .badge { padding: 4px 10px; border-radius: 4px; font-size: 12px; font-weight: bold; text-transform: uppercase; color: white; display: inline-block; }
    .badge-live { background: var(--success-color); animation: pulse 2s infinite; }
    .badge-next { background: var(--warning-color); color: #000; }
    
    @keyframes blink { 50% { opacity: 0.4; } }
    @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.7; } 100% { opacity: 1; } }
</style>
</head>
<body>

<div id="header">
  <div class="header-brand">
      <img alt="Logo" id="logo" src="./Present Pictures/institute_logo.png"/>
      <div id="header-title">ADCI | Information Hub</div>
  </div>
  <div class="ticker-wrap">
      <div class="live-dot"></div> LIVE NETWORK STATUS: OPTIMAL
  </div>
</div>

<div id="main">
  <!-- SIDEBAR -->
  <div class="col-sidebar">
      <div class="info-card clock-card">
          <div id="clock">00:00</div>
          <div id="date">Monday, Jan 1</div>
      </div>
      
      <div class="info-card weather-card" id="weather-card-bg">
         <div id="weather-content">Loading...</div>
      </div>
      
      <div class="info-card qr-box">
          <div class="qr-frame">
             <img src="./Present Pictures/QRCode.JPG" alt="Student Portal QR" 
                  onerror="this.src='https://api.qrserver.com/v1/create-qr-code/?size=200x200&data=ADCI_Portal_Fallback'">
          </div>
          <div class="qr-text-group">
              <h4>SCAN TO ACCESS MESHED</h4>
              <p>Student Portal & Grades</p>
          </div>
      </div>
  </div>

  <!-- CENTER CAROUSEL -->
  <div class="col-map" id="center-carousel">
      <!-- 1. MAP -->
      <div class="center-slide active-view" id="view-map">
          <div id="map-viz"></div>
      </div>
      <!-- 2. PHOTOS -->
      <div class="center-slide" id="view-image">
          <div id="img-bg" class="blur-bg"></div>
          <img id="img-fg" src="" class="sharp-fg ken-burns">
      </div>
      <!-- 3. VIDEO -->
      <div class="center-slide" id="view-video">
          <video class="video-content" id="promo-video" muted playsinline>
              <source src="./Present Pictures/dsc-cyb vid.mp4" type="video/mp4">
          </video>
      </div>
  </div>

  <!-- HUB -->
  <div class="col-hub">
      <div class="hub-title">TODAY'S SCHEDULE</div>
      <div id="schedule-container"></div>
  </div>
</div>

<script>
/* --- AUTO REFRESH SYSTEM --- */
// Refresh the entire page every 13 hours (46,800,000 ms)
setTimeout(() => {
    window.location.reload();
}, 46800000);


/* --- CONFIGURATION --- */
const CONFIG = {
    weatherKey: "a5bbc068379441b89cf24203251803", 
    weatherCity: "Perth",
    mapDuration: 30000, 
    photoDuration: 6000,
    
    photos: [
        "Building.jpg", "Campus Logo.jpg", "Classroom 1.jpg", "Classroom 2.jpg",
        "Enterance.jpg", "Kitchen.jpg", "Meeting Room.jpg", "orientation.jpg","orientation2.jpg", "orientation3.jpg", "orientation4.jpg",
        "Designer (1).png", "ds2.jpg", "CYB-info (1).png","CYB-info-2.png",
    ],
    
    schedule: {
       "Monday": [
            { time: "09:00", end: "12:00", name: "SEC101: Human factors Security and Privacy", room: "ADCI Classroom 1" }
        ],
        "Tuesday": [
            { time: "09:00", end: "12:00", name: "MAT101: Intro to Mathematics", room: "ADCI Classroom 1" }, 
            { time: "09:00", end: "12:00", name: "CAP301: Industry Capstone I", room: "ADCI Classroom 2" },
            { time: "12:00", end: "13:00", name: "Academic Study Skills Support", room: "ADCI Classroom 1" },
            { time: "13:00", end: "16:00", name: "CSC101: Intro to Programming", room: "ADCI Classroom 1" },
            { time: "13:00", end: "16:00", name: "CYB307: Reverse Engineering", room: "ADCI Classroom 2" }
        ],
        "Wednesday": [
            { time: "09:00", end: "12:00", name: "DNA102: Intro to Database Systems", room: "ADCI Classroom 1" },
            { time: "09:00", end: "12:00", name: "ORG202: Data, Law and Ethics", room: "ADCI Classroom 2" },
            { time: "12:00", end: "13:00", name: "Academic Study Skills Support", room: "ADCI Classroom 1" },
            { time: "13:00", end: "16:00", name: "ARI101: Intro to Artificial Intelligence", room: "ADCI Classroom 1" },
            { time: "13:00", end: "16:00", name: "CYB201: Network Security", room: "ADCI Classroom 2" },
            { time: "13:00", end: "16:00", name: "CSC305: Distributed Computing", room: "ADCI Library" }
        ],
        "Thursday": [
            { time: "09:00", end: "12:00", name: "CYB202: Data Encryption", room: "ADCI Classroom 1" },
            { time: "09:00", end: "12:00", name: "ORG303: Digital Innovation", room: "ADCI Classroom 2" },
            { time: "13:00", end: "16:00", name: "CYB306: Security and Privacy Implications of...", room: "ADCI Classroom 1" },
            { time: "13:00", end: "16:00", name: "MAT202: Statistical Computing", room: "ADCI Classroom 2" }

        ],
        "Friday": [
            { time: "09:00", end: "12:00", name: "DNA101: Fundamental of Data Science", room: "KCBT Classroom 9" },
            { time: "09:00", end: "12:00", name: "CSC203: Data Structure and Algorithms", room: "ADCI Classroom 2" },
            { time: "13:00", end: "16:00", name: "CSC102: Introduction to Computers, Networking and Cloud Computing", room: "ADCI Classroom 1" }
        ]
    }
};

/* --- CAROUSEL ENGINE --- */
let playlistIndex = 0; 
let rotationTimer;
const views = {
    map: document.getElementById('view-map'),
    image: document.getElementById('view-image'),
    video: document.getElementById('view-video')
};
const imgFg = document.getElementById('img-fg');
const imgBg = document.getElementById('img-bg');
const videoElement = document.getElementById('promo-video');

function playNextSlide() {
    Object.values(views).forEach(el => el.classList.remove('active-view'));
    clearTimeout(rotationTimer);

    if (playlistIndex === 0) {
        views.map.classList.add('active-view');
        setTimeout(drawMap, 100); 
        rotationTimer = setTimeout(nextIndex, CONFIG.mapDuration);
    } 
    else if (playlistIndex === 1) {
        views.video.classList.add('active-view');
        videoElement.currentTime = 0;
        let playPromise = videoElement.play();
        if (playPromise !== undefined) {
            playPromise.then(() => {
                videoElement.onended = () => { nextIndex(); };
            }).catch(err => { nextIndex(); });
        }
    } 
    else {
        let photoIdx = playlistIndex - 2;
        if (photoIdx < CONFIG.photos.length) {
            views.image.classList.add('active-view');
            const src = "./Present Pictures/" + CONFIG.photos[photoIdx];
            imgFg.src = src;
            imgBg.style.backgroundImage = `url('${src}')`;
            imgFg.classList.remove('ken-burns');
            void imgFg.offsetWidth;
            imgFg.classList.add('ken-burns');
            rotationTimer = setTimeout(nextIndex, CONFIG.photoDuration);
        } else {
            playlistIndex = -1; 
            nextIndex();
        }
    }
}
function nextIndex() { playlistIndex++; playNextSlide(); }
playNextSlide();

/* --- CLOCK --- */
function updateClock() {
    const now = new Date();
    document.getElementById('clock').innerText = now.toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'});
    document.getElementById('date').innerText = now.toLocaleDateString('en-AU', { weekday: 'long', day: 'numeric', month: 'short' });
}
setInterval(updateClock, 1000); updateClock();

/* --- WEATHER (Auto Refresh 10 mins) --- */
function fetchWeather() {
    fetch(`https://api.weatherapi.com/v1/current.json?key=${CONFIG.weatherKey}&q=${CONFIG.weatherCity}`)
    .then(r => r.json()).then(d => {
        const card = document.getElementById('weather-card-bg');
        const txt = d.current.condition.text.toLowerCase();
        card.className = 'info-card weather-card';
        if (txt.includes("rain") || txt.includes("drizzle") || txt.includes("shower")) card.classList.add("weather-rain");
        else if (txt.includes("thunder") || txt.includes("storm")) card.classList.add("weather-storm");
        else if (txt.includes("snow") || txt.includes("ice")) card.classList.add("weather-snow");
        else if (txt.includes("cloud") || txt.includes("overcast")) card.classList.add("weather-cloudy");
        else if (txt.includes("mist") || txt.includes("fog")) card.classList.add("weather-mist");
        else card.classList.add("weather-sunny"); 

        document.getElementById('weather-content').innerHTML = `
            <img src="https:${d.current.condition.icon}" class="weather-icon">
            <div class="weather-info">
                <div class="temp-big">${Math.round(d.current.temp_c)}°C</div>
                <div class="weather-text">${d.current.condition.text}</div>
                
            </div>
        `;
    }).catch(e => {});
}
fetchWeather(); 
// Update weather every 10 minutes (600,000ms)
setInterval(fetchWeather, 600000);

/* --- TIMETABLE --- */
function renderSchedule() {
    try {
        const container = document.getElementById('schedule-container');
        if(!container) return;
        const dNames = ["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"];
        const today = dNames[new Date().getDay()];
        let events = CONFIG.schedule[today] || [];
        container.innerHTML = "";

        if(events.length === 0) {
            container.innerHTML = `<div style="text-align:center; margin-top:60px; color:#888;"><div style="font-size:50px; margin-bottom:20px;">☕</div><div style="font-size:24px; font-weight:600;">No classes scheduled</div></div>`;
            return;
        }

        events.sort((a, b) => (a.time || "").localeCompare(b.time || ""));
        const now = new Date();
        const currentHr = now.getHours() + now.getMinutes()/60;

        events.forEach(ev => {
            let [sH, sM] = ev.time.split(":").map(Number);
            let [eH, eM] = ev.end.split(":").map(Number);
            let startVal = sH + sM/60;
            let endVal = eH + eM/60;
            let duration = endVal - startVal;

            let isActive = (currentHr >= startVal && currentHr < endVal);
            let statusClass = "";
            let badgeHtml = "";
            let progressHtml = "";
            let statsHtml = "";

            if (currentHr >= endVal) {
                statusClass = "status-past";
                badgeHtml = `<span class="badge" style="background:#ccc; color:#555;">Ended</span>`;
            } else if (isActive) {
                statusClass = "status-active";
                badgeHtml = `<span class="badge badge-live">● LIVE NOW</span>`;
                
                // MATH FOR 45% | 1/3 hrs
                let elapsed = currentHr - startVal;
                let pct = Math.min(100, Math.max(0, (elapsed / duration) * 100));
                let currentHrBlock = Math.floor(elapsed) + 1;
                let totalHrBlock = Math.ceil(duration);

                statsHtml = `<span class="progress-stats">${Math.round(pct)}% | ${currentHrBlock}/${totalHrBlock} hrs</span>`;
                progressHtml = `<div class="progress-bg"><div class="progress-fill" style="width:${pct}%"></div></div>`;
            } else {
                statusClass = "status-next";
                badgeHtml = `<span class="badge badge-next">UPCOMING</span>`;
            }

            container.innerHTML += `
            <div class="event-row ${statusClass}">
                ${progressHtml}
                <div class="event-time"><span>${ev.time}</span><span class="end-time">${ev.end}</span></div>
                <div class="event-details">
                    <h4>${ev.name}</h4>
                    <p>📍 ${ev.room} &nbsp; ${badgeHtml} ${statsHtml}</p>
                </div>
            </div>`;
        });
    } catch(error) { console.error(error); }
}
renderSchedule(); setInterval(renderSchedule,3000);
function autoScrollTimetable() {
    const el = document.getElementById('schedule-container');
    if(el.scrollHeight > el.clientHeight) {
        if(el.scrollTop + el.clientHeight >= el.scrollHeight - 5) el.scrollTo({ top: 0, behavior: 'smooth' });
        else el.scrollBy({ top: 100, behavior: 'smooth' });
    }
}
setInterval(autoScrollTimetable, 10000);

/* --- MAP --- */
var mapEl = document.getElementById("map-viz");
var proj, path;
var attacks = [];
var ripples = [];
var dm;

function drawMap() {
    if(mapEl.innerHTML !== "" && !document.getElementById('view-map').classList.contains('active-view')) return;
    mapEl.innerHTML = ""; attacks = []; ripples = [];

    dm = new Datamap({
        element: mapEl, 
        projection: 'orthographic',
        setProjection: function(el) {
            var h = el.offsetHeight; 
            var w = el.offsetWidth;
            var radius = Math.min(h, w) / 2.2;
            proj = d3.geo.orthographic().scale(radius).translate([w / 2, h / 2]).clipAngle(90);
            path = d3.geo.path().projection(proj);
            d3.select("svg circle").attr("r", radius).attr("cx", w / 2).attr("cy", h / 2);
            return { projection: proj, path: path };
        },
        fills: { defaultFill: '#d0d6db' },
        geographyConfig: { borderColor: '#ffffff', borderWidth: 1, highlightFillColor: '#b8c2cc', highlightBorderColor: '#fff' }
    });

    var svg = d3.select("svg");
    svg.insert("circle", ":first-child").attr("cx", "50%").attr("cy", "50%").attr("r", "1").style("fill", "#e3e9ef");
    window.mapLayer = svg.append("g").attr("id", "attacks");
    window.rippleLayer = svg.append("g").attr("id", "ripples");
    window.labelLayer = svg.append("g").attr("id", "labels");
    window.textElements = window.labelLayer.selectAll("text").data(cityLabels).enter().append("text").attr("class", "city-label").text(d=>d.n).attr("text-anchor","middle");
}

const cityLabels = [
  {n:"PERTH", lat:-31.95, lng:115.86}, {n:"SYDNEY", lat:-33.86, lng:151.20}, {n:"TOKYO", lat:35.68, lng:139.69}, 
  {n:"BEIJING", lat:39.90, lng:116.40}, {n:"SINGAPORE", lat:1.35, lng:103.81}, {n:"LONDON", lat:51.50, lng:-0.12}, 
  {n:"NEW YORK", lat:40.71, lng:-74.00}, {n:"SAO PAULO", lat:-23.55, lng:-46.63}
];

window.addEventListener('resize', function() { clearTimeout(window.resizeTimer); window.resizeTimer = setTimeout(drawMap, 250); });

var t0 = Date.now();
d3.timer(function() {
    var t = Date.now() - t0;
    if(proj && document.getElementById('view-map').classList.contains('active-view')) {
        proj.rotate([t * 0.01, -15]); 
        d3.selectAll("path.datamaps-subunit").attr("d", path);
        if(window.textElements) {
            window.textElements.each(function(d) {
                var center = proj.invert([mapEl.offsetWidth / 2, mapEl.offsetHeight / 2]);
                var dist = d3.geo.distance(center, [d.lng, d.lat]);
                if(dist < 1.5) {
                    var p = proj([d.lng, d.lat]);
                    d3.select(this).style("display","block").attr("x", p[0]).attr("y", p[1] - 8);
                } else { d3.select(this).style("display","none"); }
            });
        }
        var lines = window.mapLayer.selectAll("path.attack-line").data(attacks);
        lines.enter().append("path").attr("class", "attack-line").style("fill", "none").style("stroke-linecap","round").style("opacity", 0.8);
        lines.attr("d", path).style("stroke", d => d.color).style("stroke-width", d => d.width).style("stroke-dasharray", d => d.dash).style("stroke-dashoffset", d => -(t * d.speed) % 100);
        lines.exit().remove();
        var circles = window.rippleLayer.selectAll("path.ripple").data(ripples);
        circles.enter().append("path").attr("class","ripple").style("stroke", d=>d.color);
        circles.attr("d", function(d) { return d3.geo.path().projection(proj)(d3.geo.circle().origin([d.lng, d.lat]).angle(d.radius)()); }).style("opacity", d => d.opacity).style("stroke-width", d => (d.opacity * 2) + "px");
        ripples.forEach(r => { r.radius += 0.2; r.opacity -= 0.02; });
        ripples = ripples.filter(r => r.opacity > 0);
    }
});

function launchAttack() {
    try {
        if(!document.getElementById('view-map').classList.contains('active-view')) return;
        let s = cityLabels[Math.floor(Math.random()*cityLabels.length)];
        let d = cityLabels[Math.floor(Math.random()*cityLabels.length)];
        if(s!==d) {
            let id = Date.now() + Math.random();
            let rand = Math.random();
            let profile;
            if(rand < 0.4)      profile = {color: "#d32f2f", width: 3, dash: "none", speed: 0.15}; 
            else if(rand < 0.8) profile = {color: "#0056b3", width: 2, dash: "5,5", speed: 0.12}; 
            else                profile = {color: "#6200ea", width: 2, dash: "2,4", speed: 0.18};  
            attacks.push({ type: "Feature", geometry: {type:"LineString", coordinates:[[s.lng,s.lat],[d.lng,d.lat]]}, ...profile, id:id });
            setTimeout(() => { ripples.push({ lat: d.lat, lng: d.lng, radius: 0.5, opacity: 1, color: profile.color }); }, 1000);
            setTimeout(() => attacks = attacks.filter(a => a.id !== id), 2500);
        }
    } catch(e) {}
}
setInterval(launchAttack, 800);
</script>
