<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>ADCI Information Hub</title>
<!-- Fonts -->
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700;800&family=Oswald:wght@500;600;700&display=swap" rel="stylesheet">
<!-- Libraries -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/d3/3.5.17/d3.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/topojson/1.6.19/topojson.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/datamaps/0.5.1/datamaps.world.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<link href="assets/css/board.css" rel="stylesheet">
<link href="assets/css/christmas.css" rel="stylesheet">
</head>
<body>

<!-- Snowflakes are added here only in christmas mode -->
<div id="snow-container"></div>

<header id="header">
  <div class="logo"><img alt="ADCI" id="logo" src="./assets/img/institute_logo.png"/></div>
  <div class="title"><h1 id="header-title">ADCI Information Hub</h1><span>Australian Data and Cyber Institute</span></div>
  <div class="mode-chip"><i class="pulse"></i><span id="mode-chip-text"></span></div>
  <div class="clock"><b id="clock">--:--</b><small id="date"></small></div>
</header>

<main id="main">
  <!-- LEFT -->
  <section class="col">
    <div class="card weather" id="panel-weather">
      <div class="label">Perth weather</div>
      <div id="weather-content">Loading…</div>
    </div>
    <div class="card dates" id="panel-keydates">
      <div class="label">Key dates</div>
      <div id="keydates-list"></div>
    </div>
    <div class="card dark notice" id="panel-notice">
      <div class="label">Notice board</div>
      <h3 id="notice-title"></h3>
      <p id="notice-message"></p>
      <div class="pager" id="notice-pager"></div>
    </div>
  </section>

  <!-- CENTRE -->
  <section class="col">
    <div class="stage" id="stage">
      <!-- Task 5 drives the carousel slides in here -->
      <div class="center-slide active-view" id="view-map">
        <div id="map-viz"></div>
      </div>
    </div>
    <div class="rooms" id="rooms-strip"></div>
  </section>

  <!-- RIGHT -->
  <section class="col" id="hub">
    <div class="card hub-main" id="hub-main"></div>
    <div class="card dark count" id="panel-countdown" hidden>
      <small id="countdown-label"></small>
      <b id="days-count"></b>
      <span id="countdown-sub"></span>
    </div>
    <div class="card dark qr" id="panel-qr" hidden>
      <img src="./assets/img/QRCode.JPG" alt="Student Portal QR">
      <div><h3>Student system</h3><p>Scan to log in to Meshed.</p></div>
    </div>
  </section>
</main>

<footer id="ticker-bar"><div class="tag">● NOTICES</div><div class="runwrap"><div class="run" id="ticker-run"></div></div></footer>

<script type="module" src="assets/js/main.js"></script>
</body>
</html>
