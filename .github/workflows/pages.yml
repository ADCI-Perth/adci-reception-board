name: Deploy board to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  pages: write
  id-token: write
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Write version.txt (commit id; the board reloads when it changes)
        run: echo "$GITHUB_SHA" > version.txt
      - uses: actions/configure-pages@v5
      - name: Collect site files (leaves out tests, tools, docs, node_modules, archive, etc.)
        run: |
          mkdir _site
          cp index.html check.html version.txt _site/
          if [ -f README.md ]; then cp README.md _site/; fi
          cp -r assets data templates "Present Pictures" _site/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
